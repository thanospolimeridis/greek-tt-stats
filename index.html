 en:{home:'Home',events:'Competitions',players:'Players',clubs:'Clubs',rankings:'Rankings',h2h:'Head to head',about:'About',archive:'GREEK TABLE TENNIS ARCHIVE',heroTitle:'The history of Greek',heroHighlight:'table tennis.',heroCopy:'Competitions, matches, athletes and statistics, all connected in one open, source-attributed archive.',seeEvents:'Explore competitions',howItWorks:'How it works',sourceEvents:'Catalogued competitions',playersIndexed:'Players with data',matchesVerified:'Verified matches',seasons:'Seasons represented',verifiedSources:'Source verified',dataPending:'The first release includes real event listings verified against TTScore. Detailed results, players and rankings have not yet been imported; no results or statistics are invented.',viewSource:'View on TTScore',latestEvents:'Competition archive',latestDesc:'Selected, verified competition listings linking directly to the source.',allEvents:'All competitions',noMatches:'No imported and verified matches for this event yet.',filterAll:'All types',allSeasons:'All seasons',league:'Team league',open:'Open',cup:'Cup',finals:'Finals',search:'Search competitions, players or clubs...',date:'Date',region:'Region',type:'Type',season:'Season',source:'Source',results:'Results',sourceRecord:'Original record',details:'Details',name:'Name',club:'Club',rank:'Rank',points:'Points',category:'Category',opponent:'Opponent',score:'Score',round:'Round',status:'Status',playerHistory:'Match history',rankHistory:'Ranking history',wins:'Wins',losses:'Losses',winRate:'Win percentage',filter:'Filters',noPlayers:'No player records have been imported yet.',noClubs:'No club records have been imported yet.',noRankings:'No official ranking snapshots have been imported yet.',choosePlayer:'Select a player',compare:'Compare players',noH2H:'There are no verified matches between these players in this dataset.',selectTwo:'Select two distinct players to compare.',missingPlayers:'Comparison becomes available when historical match records ha const state={lang:(()=>{try{return localStorage.getItem('tt_lang')==='en'?'en':'el'}catch{return 'el'}})(), query:'', season:'all',type:'all',rankCategory:'all',page:0,player1:'',player2:'',detailTab:'matches'};
const t=k=>(dictionary[state.lang][k]||k);
const esc=v=>String(v===undefined||v===null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lower=v=>String(v||'').toLocaleLowerCase('el-GR');
const romanize=v=>fold(v).replace(/ς/g,'σ').replace(/ου/g,'ou').replace(/αι/g,'ai').replace(/ει/g,'ei').replace(/οι/g,'oi').replace(/γγ/g,'ng').replace(/μπ/g,'b').replace(/ντ/g,'d').replace(/τσ/g,'ts').replace(/τζ/g,'tz').replace(/[αβγδεζηθικλμνξοπρστυφχψω]/g,c=>({'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o'}[c]||c));
const fold=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('el-GR').replace(/ς/g,'σ');
const searchHit=(obj,q)=>!q||[obj.name,obj.region,obj.season,obj.aliases,obj.category,obj.type].filter(Boolean).some(v=>fold(v).includes(fold(q))||fold(romanize(v)).includes(fold(q)));
const datefmt=v=>{if(!v)return '—';const d=new Date(v+'T12:00:00Z');return Number.isNaN(d.getTime())?esc(v):new Intl.DateTimeFormat(state.lang==='el'?'el-GR':'en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(d)};
const eventById=new Map(db.events.map(v=>[v.id,v]));
const playerById=new Map(db.players.map(v=>[v.id,v]));
const clubById=new Map(db.clubs.map(v=>[v.id,v]));
const records=db.matches.filter(m=>m.status==='completed');
const getPlayer=id=>playerById.get(id)||{name:id||'—',id};
const getClub=id=>clubById.get(id)||{name:id||'—',id};
const getEvent=id=>eventById.get(id)||{name:id||'—',id};
const eventName=e=>esc(e.name||'—');
const link=(href,label,css='text-link')=>`<a class="${css}" href="${esc(href)}">${esc(label)}</a>`;
const external=(url,label)=>url&&/^https:\/\/[^\s"<>]+$/.test(url)?`<a class="text-link" href="${esc(url)}" rel="noopener noreferrer" target="_blank">${esc(label)} ↗</a>`:'';
const seasons=[...new Set(db.events.map(e=>e.season).filter(Boolean))].sort().reverse();
function hashRoute(){const hash=decodeURIComponent(location.hash.replace(/^#\/?/,''));const [view, ...parts]=(hash||'home').split('/');return{view: view||'home', id:parts.join('/')};}
function navActive(name){const r=hashRoute();return r.view===name||(name==='events'&&r.view==='event')||(name==='players'&&r.view==='player')||(name==='clubs'&&r.view==='club')?'active':'';}
function header(){const items=['home','events','players','clubs','rankings','h2h'];return `<header class="topbar"><div class="container top-inner"><a href="#home" class="brand" aria-label="Greek TT Archive"><span class="brandmark"><span>◉</span></span><span><span class="brandtitle">GREEK TT <span style="color:#89dccc">ARCHIVE</span></span><span class="brandunder">ΕΠΙΤΡΑΠΕΖΙΑ ΑΝΤΙΣΦΑΙΡΙΣΗ</span></span></a><nav class="nav" aria-label="Main navigation">${items.map((k,i)=>`<a href="#${k}" class="navlink ${navActive(k)} ${i===1?'navmobile':''}">${esc(t(k))}</a>`).join('')}<button id="lang-switch" class="lang" aria-label="Switch language">${state.lang==='el'?'EN':'ΕΛ'}</button></nav></div></header>`;}
function footer(){return `<footer class="footer"><div class="container footer-inner"><div><strong>Greek TT Archive</strong><p>${esc(t('siteFooter'))}</p></div><div><div class="footer-code">${esc(t('openData'))}</div><p>${external('https://app.ttscore.io/customer/24','TTScore')} · ${link('#about',t('dataTransparency'))}</p></div></div></footer>`;}
function hero(){return `<section class="hero"><div class="container heroinner"><div class="herocopy"><div class="eyebrow"><span class="tiny-dot"></span>${esc(t('archive'))}</div><h1>${esc(t('heroTitle'))}<br><strong>${esc(t('heroHighlight'))}</strong></h1><p>${esc(t('heroCopy'))}</p><div class="heroact"><a class="primary-btn" href="#events">${esc(t('seeEvents'))} →</a><a class="light-btn" href="#about">${esc(t('howItWorks'))} ↗</a></div></div><div class="heroart" aria-hidden="true"><div class="court"></div><div class="racket"></div><div class="ball"></div></div></div></section>`;}
function statsBand(){const values=[[db.events.length,'sourceEvents'],[db.players.length,'playersIndexed'],[records.length,'matchesVerified'],[seasons.length,'seasons']];return `<section class="container stats-band" aria-label="Archive coverage">${values.map(([v,k])=>`<div class="stat"><div class="statnum">${v.toLocaleString(state.lang==='el'?'el-GR':'en-US')}</div><div class="statlabel">${esc(t(k))}</div></div>`).join('')}</section>`;}
function statusBox(){if(records.length&&db.rankings.length)return '';const text=records.length?t('statsNotComplete'):t('dataPending');return `<div class="statusbox" role="status"><span class="circle">ⓘ</span><div><strong>${esc(t('importStatus'))}:</strong> ${esc(text)}</div></div>`;}
function eventCard(e){const linked=db.matches.filter(m=>m.event_id===e.id&&m.status==='completed').length;return `<article class="event-card"><div class="event-card-top"><span class="tag ${esc(e.type||'')}">${esc(t(e.type)||e.type||'Event')}</span><span class="date">${esc(e.season)}</span></div><h3><a href="#event/${encodeURIComponent(e.id)}">${eventName(e)}</a></h3><div class="event-card-meta"><span>⌖ ${esc(e.region||'—')}</span><span>◷ ${datefmt(e.start_date)}</span></div><div class="event-card-foot"><a class="text-link" href="#event/${encodeURIComponent(e.id)}">${esc(t('details'))} →</a><span class="smallmuted">${linked?`${linked} ${t('recorded').toLowerCase()}`:t('sourceOnly')}</span></div></article>`;}
function filteredEvents(){return db.events.filter(e=>(state.season==='all'||e.season===state.season)&&(state.type==='all'||e.type===state.type)&&searchHit(e,state.query));}
function eventFilters(){return `<div class="filters"><label class="sr-only" for="search-events">${esc(t('search'))}</label><input class="control" type="search" id="search-events" placeholder="${esc(t('search'))}" value="${esc(state.query)}"><label class="sr-only" for="season-filter">${esc(t('season'))}</label><select class="control" id="season-filter"><option value="all">${esc(t('allSeasons'))}</option>${seasons.map(s=>`<option value="${esc(s)}" ${s===state.season?'selected':''}>${esc(s)}</option>`).join('')}</select><label class="sr-only" for="type-filter">${esc(t('type'))}</label><select class="control" id="type-filter"><option value="all">${esc(t('filterAll'))}</option>${['league','open','cup','finals'].map(v=>`<option value="${v}" ${state.type===v?'selected':''}>${esc(t(v))}</option>`).join('')}</select></div>`;}
function eventsSection(limit){const list=filteredEvents().slice(0,limit||99999);return list.length?`<div class="cards">${list.map(eventCard).join('')}</div>`:empty('noEvents');}
function empty(k,icon='◌'){return `<div class="empty"><div class="empty-icon" aria-hidden="true">${icon}</div><h3>${esc(t('dataPendingShort'))}</h3><p>${esc(t(k))}</p><a class="ghost-btn small" href="#about">${esc(t('howItWorks'))} →</a></div>`;}
function landing(){const n=db.events.length;return hero()+statsBand()+`<main class="container main">${statusBox()}<div class="paneltop"><div><span class="kicker">${esc(t('latestRecords'))}</span><h2>${esc(t('latestEvents'))}</h2><p>${esc(t('latestDesc'))}</p></div><a class="ghost-btn small" href="#events">${esc(t('allEvents'))} →</a></div>${db.events.length?`<div class="cards">${db.events.slice(0,6).map(eventCard).join('')}</div>`:empty('noEvents')}<div class="info-grid"><section class="white-panel"><span class="kicker">${esc(t('dataTransparency'))}</span><h3>${esc(t('sourcePolicy'))}</h3><p>${esc(t('dataTransparencyText'))}</p><div class="link-row">${external('https://app.ttscore.io/customer/24',t('viewSource'))}</div></section><section class="white-panel"><span class="kicker">${esc(t('approx'))}</span><h3>${n} ${esc(t('eventsPresent'))}</h3><p>${esc(t('architectureText'))}</p><a href="#about" class="text-link">${esc(t('howItWorks'))} →</a></section></div></main>`;}
function crumb(parts){return `<div class="breadcrumbs">${parts.map((p,i)=>i===parts.length-1?`<span>${esc(p[1])}</span>`:`<a href="#${esc(p[0])}">${esc(p[1])}</a><span>›</span>`).join('')}</div>`;}
function eventsPage(){return `<main class="container main">${crumb([['home',t('home')],['events',t('events')]])}<div class="paneltop"><div><span class="kicker">${esc(t('archive'))}</span><h2>${esc(t('allEvents'))}</h2><p>${esc(t('latestDesc'))}</p></div></div>${statusBox()}${eventFilters()}${eventsSection()}</main>`;}
function completedForPlayer(id){return records.filter(m=>m.player1_id===id||m.player2_id===id)}
function playerStats(id){const ms=completedForPlayer(id);const wins=ms.filter(m=>m.winner_id===id).length;return{ms,wins,losses:ms.length-wins,rate:ms.length?Math.round(wins/ms.length*100):null}}
function dataTable(headers,rows,emptyKey='tableEmpty'){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(t(h))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty(emptyKey)}
function matchRow(m,id){const counterpart=id?(m.player1_id===id?m.player2_id:m.player1_id):null;const source=external(m.source_url,'↗');const score=[m.score1,m.score2].every(v=>v!==null&&v!==undefined&&v!=='')?`${m.score1}–${m.score2}`:'—';const result=id?m.status==='completed'?(m.winner_id===id?'✓':'✕'):m.status:'';return `<tr><td>${datefmt(m.date)}</td><td>${id?link('#player/'+encodeURIComponent(counterpart),getPlayer(counterpart).name):link('#player/'+encodeURIComponent(m.player1_id),getPlayer(m.player1_id).name)+' <span class="smalltext">vs</span> '+link('#player/'+encodeURIComponent(m.player2_id),getPlayer(m.player2_id).name)}</td><td><span class="score ${m.status==='completed'?'':'muted-score'}">${esc(result)} ${esc(score)}</span></td><td>${link('#event/'+encodeURIComponent(m.event_id),getEvent(m.event_id).name)}</td><td>${source}</td></tr>`;}
function fixturesTable(fixtures){return dataTable(['date','club','score','opponent','source'],fixtures.map(f=>`<tr><td>${datefmt(f.date)}</td><td>${link('#club/'+encodeURIComponent(f.home_club_id),getClub(f.home_club_id).name)}</td><td><span class="score">${f.home_score??'—'}–${f.away_score??'—'}</span></td><td>${link('#club/'+encodeURIComponent(f.away_club_id),getClub(f.away_club_id).name)}</td><td>${external(f.source_url,'↗')}</td></tr>`),'noFixtures');}
function eventPage(id){const e=eventById.get(id);if(!e)return notFound();const ms=db.matches.filter(m=>m.event_id===id);const fs=db.fixtures.filter(f=>f.event_id===id);return `<main class="container main">${crumb([['home',t('home')],['events',t('events')],['event/'+id,e.name]])}<div class="detailhead"><div class="detailhead-top"><div class="detail-title-area"><span class="kicker">${esc(t('events'))} · ${esc(e.season)}</span><h1 class="title-detail">${eventName(e)}</h1><div class="detail-chips"><span>⌖ ${esc(e.region||'—')}</span><span>◷ ${datefmt(e.start_date)} – ${datefmt(e.end_date)}</span><span>${esc(t(e.type||'')||e.type||'')}</span></div><div class="proof">✓ ${esc(t('verified'))} · TTScore</div></div><div>${external(e.source_url,t('viewSource'))}</div></div></div><div class="results-grid"><div class="metric"><span>${esc(t('individualMatches'))}</span><strong>${ms.length}</strong></div><div class="metric"><span>${esc(t('clubFixtures'))}</span><strong>${fs.length}</strong></div><div class="metric"><span>${esc(t('season'))}</span><strong style="font-size:21px">${esc(e.season)}</strong></div></div><div class="section-header"><h3>${esc(t('individualMatches'))}</h3></div>${dataTable(['date','name','score','events','source'],ms.map(m=>matchRow(m)),'noMatches')}<div class="section-header"><h3>${esc(t('clubFixtures'))}</h3></div>${fixturesTable(fs)}<p class="source-note" style="margin-top:22px">${esc(t('statsNotComplete'))} ${external(e.source_url,t('recordSource'))}</p></main>`;}
function rosterPage(kind){const isPlayer=kind==='players';const data=isPlayer?db.players:db.clubs;const title=isPlayer?t('allPlayers'):t('allClubs');const list=data.filter(v=>searchHit(v,state.query)).sort((a,b)=>a.name.localeCompare(b.name,'el'));return `<main class="container main">${crumb([['home',t('home')],[kind,t(kind)]])}<div class="paneltop"><div><span class="kicker">${esc(t('archive'))}</span><h2>${esc(title)}</h2></div></div>${statusBox()}<div class="filters"><label class="sr-only" for="search-roster">${esc(t('search'))}</label><input class="control" type="search" id="search-roster" placeholder="${esc(t('search'))}" value="${esc(state.query)}"></div>${list.length?`<div class="cards">${list.map(v=>`<a href="#${isPlayer?'player':'club'}/${encodeURIComponent(v.id)}" class="${isPlayer?'person-card':'club-card'}"><div class="listmain"><div class="round-icon">${esc((v.name||'?').charAt(0))}</div><div><div class="listname">${esc(v.name)}</div><div class="listmeta">${isPlayer?esc(getClub(v.club_id).name):esc(v.region||'')}</div></div></div><div class="event-card-foot" style="margin-top:19px"><span class="text-link">${esc(t('view'))} →</span></div></a>`).join('')}</div>`:empty(isPlayer?'noPlayers':'noClubs')}</main>`;}
function latestRanking(id){return db.rankings.filter(r=>r.player_id===id).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function rankingSpark(rows){if(rows.length<2)return '';const ordered=[...rows].sort((a,b)=>a.date.localeCompare(b.date));const max=Math.max(...ordered.map(r=>Number(r.rank)));const min=Math.min(...ordered.map(r=>Number(r.rank)));const height=105,width=420,pad=12;const points=ordered.map((r,i)=>`${pad+i*(width-2*pad)/Math.max(1,ordered.length-1)},${pad+(Number(r.rank)-min)*(height-2*pad)/Math.max(1,max-min)}`).join(' ');return `<svg role="img" aria-label="Ranking trend" viewBox="0 0 ${width} ${height}" style="max-width:100%;margin:20px 0"><line x1="12" x2="408" y1="93" y2="93" stroke="#d6e4e3" stroke-width="1"/><polyline points="${points}" fill="none" stroke="#008b85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function playerPage(id){const p=playerById.get(id);if(!p)return notFound();const s=playerStats(id);const ranks=db.rankings.filter(r=>r.player_id===id).sort((a,b)=>b.date.localeCompare(a.date));const latest=ranks[0];return `<main class="container main">${crumb([['home',t('home')],['players',t('players')],['player/'+id,p.name]])}<div class="detailhead"><div class="detailhead-top"><div class="detail-title-area"><span class="kicker">${esc(t('players'))}</span><h1 class="title-detail">${esc(p.name)}</h1><div class="detail-chips"><span>♧ ${esc(getClub(p.club_id).name)}</span>${latest?`<span>${esc(t('rank'))}: #${latest.rank} · ${esc(latest.category)}</span>`:''}</div></div><a class="ghost-btn small" href="#h2h">${esc(t('compare'))} →</a></div></div><div class="results-grid"><div class="metric"><span>${esc(t('wins'))}</span><strong>${s.wins}</strong></div><div class="metric"><span>${esc(t('losses'))}</span><strong>${s.losses}</strong></div><div class="metric"><span>${esc(t('winRate'))}</span><strong>${s.rate===null?'—':s.rate+'%'}</strong></div></div><div class="section-header"><h3>${esc(t('playerHistory'))}</h3></div>${dataTable(['date','opponent','score','events','source'],s.ms.sort((a,b)=>b.date.localeCompare(a.date)).map(m=>matchRow(m,id)),'noMatches')}<div class="section-header"><h3>${esc(t('rankHistory'))}</h3></div>${ranks.length?`<div class="white-panel">${rankingSpark(ranks.filter(r=>r.category===latest.category))}${dataTable(['date','category','rank','points','source'],ranks.map(r=>`<tr><td>${datefmt(r.date)}</td><td>${esc(r.category)}</td><td>#${r.rank}</td><td>${r.points??'—'}</td><td>${external(r.source_url,'↗')}</td></tr>`))}</div>`:empty('noRankData')}<p class="source-note" style="margin-top:22px">${esc(t('statsNotComplete'))}</p></main>`;}
function clubPage(id){const c=clubById.get(id);if(!c)return notFound();const ps=db.players.filter(p=>p.club_id===id);const fs=db.fixtures.filter(f=>f.home_club_id===id||f.away_club_id===id);return `<main class="container main">${crumb([['home',t('home')],['clubs',t('clubs')],['club/'+id,c.name]])}<div class="detailhead"><span class="kicker">${esc(t('clubs'))}</span><h1 class="title-detail">${esc(c.name)}</h1><p>${esc(c.region||'')}</p></div><div class="section-header"><h3>${esc(t('relatedPlayers'))} · ${ps.length}</h3></div>${ps.length?`<div class="white-panel">${ps.map(p=>`<div class="listrow"><div class="listmain"><div class="round-icon">${esc(p.name.charAt(0))}</div><div class="listname">${esc(p.name)}</div></div>${link('#player/'+encodeURIComponent(p.id),t('view')+' →')}</div>`).join('')}</div>`:empty('noPlayers')}<div class="section-header"><h3>${esc(t('clubFixtures'))}</h3></div>${fixturesTable(fs)}</main>`;}
function rankingsPage(){const cats=[...new Set(db.rankings.map(r=>r.category))].sort();const data=db.rankings.filter(r=>state.rankCategory==='all'||r.category===state.rankCategory);const datesByCat=new Map();for(const r of data){const last=datesByCat.get(r.category);if(!last||last<r.date)datesByCat.set(r.category,r.date)}const current=data.filter(r=>datesByCat.get(r.category)===r.date).sort((a,b)=>a.rank-b.rank);return `<main class="container main">${crumb([['home',t('home')],['rankings',t('rankings')]])}<div class="paneltop"><div><span class="kicker">${esc(t('fromSource'))}</span><h2>${esc(t('rankings'))}</h2><p>${esc(t('statsNotComplete'))}</p></div></div>${statusBox()}${cats.length?`<div class="filters"><label for="ranking-category">${esc(t('category'))}:</label><select id="ranking-category" class="control"><option value="all">${esc(t('filterAll'))}</option>${cats.map(c=>`<option value="${esc(c)}" ${c===state.rankCategory?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}${dataTable(['rank','name','category','points','date','source'],current.map(r=>`<tr><td><strong>#${r.rank}</strong></td><td>${link('#player/'+encodeURIComponent(r.player_id),getPlayer(r.player_id).name)}</td><td>${esc(r.category)}</td><td>${r.points??'—'}</td><td>${datefmt(r.date)}</td><td>${external(r.source_url,'↗')}</td></tr>`),'noRankings')}</main>`;}
function h2hPage(){const opts=`<option value="">${esc(t('choosePlayer'))}</option>`+db.players.slice().sort((a,b)=>a.name.localeCompare(b.name,'el')).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');const id1=state.player1,id2=state.player2;const both=id1&&id2&&id1!==id2;const meetings=both?records.filter(m=>[m.player1_id,m.player2_id].includes(id1)&&[m.player1_id,m.player2_id].includes(id2)):[];const w1=meetings.filter(m=>m.winner_id===id1).length,w2=meetings.filter(m=>m.winner_id===id2).length;return `<main class="container main">${crumb([['home',t('home')],['h2h',t('h2h')]])}<div class="paneltop"><div><span class="kicker">${esc(t('players'))}</span><h2>${esc(t('compare'))}</h2><p>${esc(t('statsNotComplete'))}</p></div></div><div class="white-panel"><div class="compare-selects"><select id="h2h-player1" aria-label="Player one">${opts}</select><div class="versus">VS</div><select id="h2h-player2" aria-label="Player two">${opts}</select></div>${both?`<div class="compareline"><span>${esc(getPlayer(id1).name)} · ${w1}</span><span>${w2} · ${esc(getPlayer(id2).name)}</span></div><div class="comparebar"><span style="width:${meetings.length?100*w1/meetings.length:50}%"></span><span style="width:${meetings.length?100*w2/meetings.length:50}%"></span></div>${dataTable(['date','events','score','source'],meetings.map(m=>`<tr><td>${datefmt(m.date)}</td><td>${link('#event/'+encodeURIComponent(m.event_id),getEvent(m.event_id).name)}</td><td><span class="score">${m.score1??'—'}–${m.score2??'—'}</span></td><td>${external(m.source_url,'↗')}</td></tr>`),'noH2H')}`:empty(db.players.length<2?'missingPlayers':'selectTwo')}</div></main>`;}
function aboutPage(){return `<main class="container main">${crumb([['home',t('home')],['about',t('about')]])}<div class="paneltop"><div><span class="kicker">${esc(t('openData'))}</span><h2>${esc(t('dataTransparency'))}</h2></div></div><div class="info-grid" style="margin-top:0"><div class="white-panel"><h3>${esc(t('dataTransparency'))}</h3><p>${esc(t('dataTransparencyText'))}</p><p>${esc(t('statsNotComplete'))}</p><div class="link-row">${external('https://app.ttscore.io/customer/24',t('viewSource'))}</div></div><div class="white-panel"><h3>${esc(t('importStatus'))}</h3><div class="progress"><span>${db.events.length} ${esc(t('events'))}</span><span>${db.players.length} ${esc(t('players'))}</span><span>${records.length} ${esc(t('results'))}</span><span>${db.rankings.length} ${esc(t('rankings'))}</span></div><p style="margin-top:20px">${esc(db.meta.data_coverage)}</p></div><div class="white-panel"><h3>${esc(t('architecture'))}</h3><p>${esc(t('architectureText'))}</p><p>${esc(t('openData'))}</p></div><div class="white-panel"><h3>${esc(t('importPlan'))}</h3><p>${esc(t('importPlanText'))}</p><p class="source-note">CSV → Python validation → static HTML → GitHub Pages.</p></div></div></main>`;}
function notFound(){return `<main class="container main">${crumb([['home',t('home')],['home','404']])}${empty('tableEmpty')}<a href="#home" class="text-link">${esc(t('goBack'))}</a></main>`;}
function render(){document.documentElement.lang=state.lang;const route=hashRoute();const views={home:landing,events:eventsPage,players:()=>rosterPage('players'),clubs:()=>rosterPage('clubs'),rankings:rankingsPage,h2h:h2hPage,about:aboutPage};const content=views[route.view]?views[route.view]():route.view==='event'?eventPage(route.id):route.view==='player'?playerPage(route.id):route.view==='club'?clubPage(route.id):notFound();app.innerHTML=header()+content+footer();if(route.view==='h2h'){const a=document.getElementById('h2h-player1'),b=document.getElementById('h2h-player2');if(a)a.value=state.player1;if(b)b.value=state.player2;}}
window.addEventListener('hashchange',()=>{state.query='';state.season='all';state.type='all';window.scrollTo({top:0,behavior:'auto'});render();});
function focusRerender(id){const el=document.getElementById(id);const start=el&&typeof el.selectionStart==='number'?el.selectionStart:undefined;render();const next=document.getElementById(id);if(next){next.focus();if(start!==undefined)next.setSelectionRange(start,start)}}
document.addEventListener('input',e=>{if(e.target.matches('#search-events,#search-roster')){state.query=e.target.value;focusRerender(e.target.id)}});
document.addEventListener('change',e=>{if(e.target.id==='season-filter'){state.season=e.target.value;render()}if(e.target.id==='type-filter'){state.type=e.target.value;render()}if(e.target.id==='ranking-category'){state.rankCategory=e.target.value;render()}if(e.target.id==='h2h-player1'){state.player1=e.target.value;render()}if(e.target.id==='h2h-player2'){state.player2=e.target.value;render()}});
document.addEventListener('click',e=>{if(e.target.closest('#lang-switch')){state.lang=state.lang==='el'?'en':'el';try{localStorage.setItem('tt_lang',state.lang)}catch{}render()}});
render();
})();
</script>
</body>
