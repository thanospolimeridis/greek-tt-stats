name: Validate archive
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/import_csv.py
      - run: python scripts/build.py
      - run: node tests/smoke.js
      - name: Check committed snapshot and portable build
        run: git diff --exit-code -- data/catalog.json index.html
